<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17324d; }
      .sub { font: 400 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #637789; }
      .card { fill: #ffffff; stroke: #d7e2eb; stroke-width: 2; rx: 10; }
      .h { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #17324d; }
      .t { font: 400 19px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #2e455b; }
      .tag { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .note { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="1000"/>

  <text class="title" x="500" y="72" text-anchor="middle">飞行仿真系统说明图</text>
  <text class="sub" x="500" y="108" text-anchor="middle">C 语言 + SDL2 为底层技术基座</text>

  <rect class="card" x="110" y="165" width="340" height="300"/>
  <rect x="110" y="165" width="340" height="58" rx="10" fill="#1f6f9f"/>
  <text class="tag" x="280" y="202" text-anchor="middle">1. 底层技术基座</text>
  <text class="h" x="145" y="270">C 语言</text>
  <text class="t" x="145" y="312">数据结构 / 模块协作</text>
  <text class="h" x="145" y="366">SDL2</text>
  <text class="t" x="145" y="408">图形渲染 / 事件响应</text>

  <rect class="card" x="550" y="165" width="340" height="300"/>
  <rect x="550" y="165" width="340" height="58" rx="10" fill="#2f7d68"/>
  <text class="tag" x="720" y="202" text-anchor="middle">2. 飞行数据映射</text>
  <text class="h" x="585" y="270">X-Plane 11</text>
  <text class="t" x="585" y="312">UDP 低延迟传输</text>
  <text class="t" x="585" y="355">参数解析与映射</text>
  <text class="h" x="585" y="410">PFD / ND / EICAS</text>

  <rect class="card" x="110" y="530" width="340" height="300"/>
  <rect x="110" y="530" width="340" height="58" rx="10" fill="#6d5cae"/>
  <text class="tag" x="280" y="567" text-anchor="middle">3. FMC 飞行计算机</text>
  <text class="t" x="145" y="638">起降地点编辑</text>
  <text class="t" x="145" y="682">自定义航路规划</text>
  <text class="t" x="145" y="726">爬升 / 巡航 / 降落配置</text>
  <text class="t" x="145" y="770">进场、离场程序设定</text>

  <rect class="card" x="550" y="530" width="340" height="300"/>
  <rect x="550" y="530" width="340" height="58" rx="10" fill="#c28731"/>
  <text class="tag" x="720" y="567" text-anchor="middle">4. 地图信息模块</text>
  <text class="h" x="585" y="638">高德地图 API</text>
  <text class="t" x="585" y="682">HTTP 接入</text>
  <text class="t" x="585" y="726">航班位置 / 航迹</text>
  <text class="t" x="585" y="770">天气 / 航行路线</text>

  <rect x="170" y="890" width="660" height="56" rx="10" fill="#17324d"/>
  <text class="note" x="500" y="925" text-anchor="middle">形成驾驶舱 + 客舱一体化飞行仿真展示平台</text>
</svg>
